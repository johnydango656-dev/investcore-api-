databases:
  - name: investment-db
    databaseName: investment_db
    user: postgres
    plan: free

services:
  - type: web
    name: investment-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: investment-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true